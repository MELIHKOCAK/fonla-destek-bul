name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test modu — live Stripe anahtarı kabul edilmez.
      NODE_ENV: test
      # Boş bırakılırsa testler atlar; CI'da test mode secret'ları
      # repository secret olarak set edilir.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against live Stripe key in CI
        run: |
          if [[ "${STRIPE_SECRET_KEY:-}" == sk_live_* ]]; then
            echo "::error::Live Stripe secret detected in CI environment"
            exit 1
          fi
          if [[ "${STRIPE_PUBLISHABLE_KEY:-}" == pk_live_* ]]; then
            echo "::error::Live Stripe publishable key detected in CI environment"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit & component tests
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            **/*.log
            test-results/**
          if-no-files-found: ignore
